# 스키드패드 자동 주행: 오른쪽 원 2바퀴, 왼쪽 원 2바퀴. 구간 2와 4가 기록 랩입니다.
name: skidpad_auto
project: ..
seed: 1

time:
  dt: 0.001
  mode: fast
  t_end: 40

track:
  template: skidpad

driver:
  type: pursuit
  profile:
    lateral_g: 1.3
    accel_g: 0.6
    brake_g: 1.0
    max_kph: 60

logging:
  rate_hz: 100
  signals: ["veh.*", "drv.*", "pt.*", "track.*"]
