# 예제 오토크로스 트랙을 자동 주행(Pure Pursuit + 속도 프로파일)으로 3랩.
name: autocross_auto
project: ..
seed: 1

time:
  dt: 0.001
  mode: fast
  t_end: 75

track:
  template: autocross          # templates/tracks/autocross.track.json

driver:
  type: pursuit
  # line: racing                # 주행 라인. 생략하면 트랙 파일의 첫 번째 라인, 없으면 center
  profile:                     # 준정상상태 속도 프로파일
    lateral_g: 1.3
    accel_g: 0.9
    brake_g: 1.2
    max_kph: 100

logging:
  rate_hz: 100
  signals: ["veh.*", "drv.*", "pt.*", "bat.*", "vcu.*", "track.*"]
