test: aero_dive
description: 차고 공력 맵 (L3). 105 km/h에서 다운포스가 차를 앞뒤 약 17 mm 내려앉혀 다운포스가 14 % 늘고, 강한 제동으로 코가 숙여지면 앞 차고가 실속점(-20 mm) 아래로 내려가 언더트레이가 실속합니다. 속도가 줄어 앞이 올라오면 압력중심이 다시 앞으로 갑니다.
scenario: ../scenarios/aero_dive.yaml
checks:
  - name: 순항 중 앞뒤 차고 15 mm 이상 내려앉음
    expr: "max(window(veh.aero.ride_height_front, 2, 3)) < -0.015 and max(window(veh.aero.ride_height_rear, 2, 3)) < -0.015"
  - name: 순항 다운포스가 고정 계수(약 1.69 kN)보다 9 % 이상 큼
    expr: "mean(window(veh.aero.downforce, 2, 3)) > 1850"
  - name: 제동 직후 앞 차고가 실속점 아래
    expr: "min(window(veh.aero.ride_height_front, 3, 3.5)) < -0.021"
  - name: 실속 중에는 압력중심이 덜 앞으로 (0.475 미만)
    expr: "mean(window(veh.aero.front_ratio, 3.1, 3.3)) < 0.475"
  - name: 실속에서 벗어나면 앞으로 (0.49 이상)
    expr: "max(window(veh.aero.front_ratio, 3.5, 4.5)) > 0.49"
  - name: 에너지 수지 오차 1 J 미만
    expr: "abs(final(energy.residual)) < 1"
