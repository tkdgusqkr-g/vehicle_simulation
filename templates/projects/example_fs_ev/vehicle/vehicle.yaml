# 예제 차량 파라미터 (대표값). M4부터는 차량 빌더가 CAD에서 대부분을 채웁니다.
model: single_track            # M0: L1 single-track

mass_kg: 280                   # 드라이버 포함
yaw_inertia_kgm2: 110
wheelbase_m: 1.53
cg_to_front_axle_m: 0.80       # 무게중심 → 앞차축
cg_height_m: 0.28
track_width_m: 1.22            # 화면 표시용 (single-track 모델은 사용하지 않음)

steering:
  ratio: 4.5                   # 핸들각 / 바퀴 조향각
  max_wheel_angle_deg: 110     # 핸들 최대각

tire:
  radius_m: 0.203
  mu: 1.6
  B: 12.0                      # Magic Formula (횡방향, 축 단위)
  C: 1.4
  E: 0.2
  rolling_resistance: 0.015
  # 축별로 다르게 하려면 front: / rear: 아래에 mu, B, C, E를 지정

aero:
  cla_m2: 3.2
  cda_m2: 1.3
  front_ratio: 0.45            # 다운포스 중 앞축 비율
  air_density_kgm3: 1.2

powertrain:
  motors: [fl, fr, rl, rr]     # 4WD 인휠
  motor_torque_max_nm: 21      # 모터 1개
  motor_power_max_kw: 35       # 모터 1개
  gear_ratio: 14.0
  gear_efficiency: 0.97

brakes:
  max_pressure_bar: 60         # 페달 최대
  front_gain_nm_per_bar: 30    # 앞축 합계
  rear_gain_nm_per_bar: 18     # 뒤축 합계
