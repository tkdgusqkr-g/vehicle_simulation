<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vsim 전기 네트워크</title>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<style>
  :root {
    --bg: #12151a; --panel: #181c22; --panel-2: #1f242c; --border: #2c3440; --text: #e6e9ee;
    --muted: #8a94a3; --accent: #4fb3ff; --good: #3ecf8e; --bad: #ff5c5c; --warn: #ffb347;
    --hv: #ff8a3d; --lv: #6fb8ff; --sig: #7ddc9a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; font-size: 14px; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--bad); }
  .dot.on { background: var(--good); }
  .muted { color: var(--muted); }
  main { display: grid; grid-template-columns: 250px minmax(480px, 1fr) 340px; gap: 12px; padding: 12px 16px; }
  @media (max-width: 1250px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px;
    overflow-x: auto; }
  h2 { font-size: 13.5px; margin: 0 0 8px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  h2 .grow { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 3px 5px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.sel { background: #22303f; }
  tr.click { cursor: pointer; }
  tr.click:hover { background: #1c2733; }
  input, select, textarea { background: #101317; color: var(--text); border: 1px solid var(--border); border-radius: 5px;
    padding: 3px 5px; font: inherit; font-size: 12.5px; }
  textarea { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  input.n { width: 76px; text-align: right; }
  input.w { width: 100%; }
  input.bad, textarea.bad { border-color: var(--bad); }
  button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 11px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #041018; border-color: var(--accent); font-weight: 600; }
  button.small { padding: 2px 7px; font-size: 12px; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .tabs button.on { border-color: var(--accent); color: var(--accent); }
  .scroll { overflow: auto; max-height: 420px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 5px 0; }
  .warn { color: var(--warn); } .bad { color: var(--bad); } .good { color: var(--good); }
  .pill { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: #2a3442; color: var(--muted); }
  .bar { height: 8px; background: #101317; border-radius: 4px; overflow: hidden; width: 110px; display: inline-block; vertical-align: middle; }
  .bar div { height: 100%; background: var(--good); }
  .bar.hot div { background: var(--warn); } .bar.over div { background: var(--bad); }
  #notices { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; max-width: 520px; z-index: 5; }
  .notice { background: var(--panel-2); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 6px;
    padding: 8px 12px; font-size: 13px; white-space: pre-wrap; }
  .notice.error { border-left-color: var(--bad); }
  .error-box { border: 1px solid var(--bad); background: #2a1416; border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; white-space: pre-wrap; font-size: 13px; }
  /* palette and list */
  .palette { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .palette button { font-size: 12px; padding: 4px 5px; text-align: left; }
  .palette .grp { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; margin-top: 6px; }
  #list { max-height: 520px; overflow: auto; }
  #list div { padding: 3px 6px; border-radius: 5px; cursor: pointer; display: flex; gap: 6px; align-items: center; font-size: 12.5px; }
  #list div:hover { background: #1c2733; } #list div.sel { background: #22303f; }
  #list .ty { color: var(--muted); font-size: 11px; margin-left: auto; }
  /* schematic */
  #canvas-wrap { position: relative; height: calc(100vh - 360px); min-height: 460px; background: #0e1116; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  #canvas { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
  #canvas.panning { cursor: grabbing; }
  .comp rect { fill: #1b2129; stroke: #3a4554; stroke-width: 1.2; }
  .comp.sel rect { stroke: var(--accent); stroke-width: 2; }
  .comp.on rect { stroke: var(--good); } .comp.off rect { stroke: var(--bad); } .comp.warn rect { stroke: var(--warn); }
  .comp text { fill: var(--text); font-size: 11px; pointer-events: none; }
  .comp text.sub { fill: var(--muted); font-size: 9.5px; }
  .comp text.val { fill: #ffd38a; font-size: 9.5px; }
  .comp .icon { font-size: 14px; }
  .term { fill: #0e1116; stroke: #8a94a3; stroke-width: 1.2; cursor: crosshair; }
  .term:hover { stroke: var(--accent); fill: var(--accent); }
  .tlabel { fill: #6b7584; font-size: 8px; pointer-events: none; }
  .edge { stroke-width: 1.4; fill: none; }
  .netnode { cursor: move; }
  .netnode circle { stroke: #0e1116; stroke-width: 1.5; }
  .netnode text { font-size: 10px; fill: var(--muted); pointer-events: none; }
  .netnode text.v { fill: #ffd38a; }
  .gnd { stroke: #8a94a3; stroke-width: 1.2; }
  #legend { position: absolute; left: 10px; bottom: 8px; font-size: 11.5px; color: var(--muted); background: rgba(14,17,22,.85); padding: 4px 8px; border-radius: 6px; }
  #legend i { display: inline-block; width: 14px; height: 3px; margin: 0 4px 2px 10px; vertical-align: middle; }
  #canvas-tools { position: absolute; right: 10px; top: 8px; display: flex; gap: 6px; }
  .prop label { display: block; color: var(--muted); font-size: 11.5px; margin-top: 7px; }
  .prop .hint { color: #6b7584; font-size: 11px; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 3px 8px; align-items: center; font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>전기 네트워크</h1>
  <span><span class="dot" id="conn-dot"></span><span id="conn">연결 안 됨</span></span>
  <span class="muted" id="project"></span>
  <label><input type="checkbox" id="enabled"> 사용</label>
  <label class="muted">해석 <select id="level"><option value="">realism.electrical 따름 (E2)</option>
    <option value="E1">E1 저항 (정상상태)</option><option value="E2">E2 과도 (C·L·응답)</option></select></label>
  <label class="muted">시작 <select id="initial"><option value="active">active (프리차지 완료)</option><option value="off">off (모두 꺼짐)</option></select></label>
  <span style="flex:1"></span>
  <span class="muted" id="dirty"></span>
  <button id="check">동작점 검사</button>
  <button id="yaml-btn">YAML</button>
  <button class="primary" id="save">저장하고 다시 불러오기</button>
</header>
<main>
  <div>
    <section>
      <h2>부품 추가</h2>
      <div class="palette" id="palette"></div>
    </section>
    <section>
      <h2>부품 <span class="grow"></span><input id="filter" placeholder="찾기" style="width:110px"></h2>
      <div id="list"></div>
    </section>
  </div>
  <div>
    <div id="load-error"></div>
    <div id="canvas-wrap">
      <svg id="canvas"><defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/></marker>
      </defs><g id="viewport"><g id="edges"></g><g id="nets"></g><g id="comps"></g><line id="rubber" class="edge" stroke="#4fb3ff" stroke-dasharray="4 3" visibility="hidden"/></g></svg>
      <div id="canvas-tools">
        <select id="values" title="그림에 표시할 값"><option value="op">값: 동작점 검사</option><option value="live">값: 실행 중</option><option value="none">값: 숨김</option></select>
        <button class="small" id="autolayout">자동 배치</button>
        <button class="small" id="fit">전체 보기</button>
      </div>
      <div id="legend"><i style="background:var(--hv)"></i>HV (60 V 이상) <i style="background:var(--lv)"></i>LV <i style="background:var(--sig)"></i>센서·신호
        · 단자를 끌어 망(점)이나 다른 단자에 놓으면 연결, 빈 곳에 놓으면 새 망</div>
    </div>
    <section style="margin-top:12px">
      <div class="tabs" id="tabs"></div>
      <div id="tab" class="scroll"></div>
    </section>
  </div>
  <div>
    <section class="prop" id="props"><h2>속성</h2><div class="muted">부품을 고르세요.</div></section>
    <section id="yaml-section" style="display:none">
      <h2>netlist YAML <span class="grow"></span><button class="small" id="yaml-apply">적용</button></h2>
      <textarea id="yaml" rows="24"></textarea>
    </section>
  </div>
</main>
<datalist id="net-list"></datalist>
<datalist id="signal-list"></datalist>
<datalist id="comp-list"></datalist>
<div id="notices"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const wsUrl = new URLSearchParams(location.search).get("ws") || "ws://127.0.0.1:8765";
const HEADER = "# 전기 네트워크 (설계 문서 §12.3). ui/elec에서 저장함.\n";
let ws = null, state = null, net = {}, sel = null, dirty = false, fingerprint = "", op = null, opError = "";
let tab = "faults", view = { x: 40, y: 40, k: 1 };

// --- Component types: terminals and parameters --------------------------------------------
// [key, unit, default, description]; params left out of the form go to "기타 설정 (YAML)".
const TYPES = {
  battery_model: { label: "축전지", group: "HV", icon: "🔋", terms: ["pos", "neg"], params: [], doc: "차량의 셀 모델(vehicle.battery): 개방전압 + 팩 저항. 하나만." },
  inverter: { label: "인버터", group: "HV", icon: "⚙", terms: ["pos", "neg"], params: [["v_min", "V", 60, "이 아래면 꺼짐"], ["v_on", "V", "", "다시 켜지는 전압 (v_min+10)"], ["v_max", "V", "", "과전압 차단"], ["logic", "ecu id", "", "제어보드 전원 ECU"], ["p_idle_w", "W", 0, ""]], doc: "motors: [fl, fr] 모터의 DC 전력을 정전력 부하로. enable: 조건(예: 프리차지 완료)." },
  contactor: { label: "컨택터", group: "HV", icon: "⊣⊢", terms: ["a", "b", "coil_a", "coil_b"], params: [["coil_r_ohm", "Ω", 24], ["pull_in_v", "V", 9], ["drop_out_v", "V", 4], ["close_ms", "ms", 25], ["open_ms", "ms", 10], ["r_on_ohm", "Ω", 0.0003], ["rating_a", "A", 200], ["normally", "open/closed", "open"]], doc: "코일 전압이 pull_in 이상이면 close_ms 뒤 붙고 drop_out 이하면 open_ms 뒤 떨어짐." },
  precharge: { label: "프리차지 제어", group: "HV", icon: "⏱", terms: ["supply", "ref", "pack.0", "pack.1", "link.0", "link.1", "pre_out.0", "pre_out.1", "air_out.0", "air_out.1"],
    params: [["threshold", "-", 0.95, "DC 링크 / 팩"], ["mode", "voltage/time", "voltage"], ["time_s", "s", 2], ["timeout_s", "s", 5], ["min_time_s", "s", 0], ["overlap_s", "s", 0.05], ["rule_ratio", "-", 0.9, "규정 검사"], ["air_relay", "relay id", "", "AIR+ (붙는 순간 비율 검사)"], ["v_on", "V", 8]],
    doc: "supply 전원이 들어오면 pre_out을 닫고, 비율이 threshold에 닿으면 air_out을 닫은 뒤 pre_out을 엶. timeout이면 고장(4)." },
  dcdc: { label: "DC-DC", group: "HV", icon: "⇄", terms: ["in_pos", "in_neg", "out_pos", "out_neg"], params: [["v_out", "V", 13.5], ["i_max_a", "A", 20], ["efficiency", "-", 0.9], ["r_out_ohm", "Ω", 0.02], ["response_s", "s", 0.002], ["v_in_min", "V", 0], ["v_in_on", "V", ""], ["p_idle_w", "W", 2]], doc: "평균 모델. 부하가 갑자기 늘면 r_out×ΔI만큼 처졌다가 response_s로 회복. enable: 조건." },
  lv_battery: { label: "LV 배터리", group: "LV", icon: "🔋", terms: ["pos", "neg"], params: [["capacity_ah", "Ah", 5], ["r_ohm", "Ω", 0.02], ["soc", "-", 0.9], ["v_empty", "V", 12], ["v_full", "V", 13.6]], doc: "OCV(SoC) 표는 ocv_soc / ocv_v. 시나리오 initial.lv_soc가 soc보다 우선." },
  ecu: { label: "ECU", group: "LV", icon: "▣", terms: ["a", "b"], params: [["i_a", "A", 0.2], ["p_w", "W", "", "정전력이면"], ["v_min", "V", 7, "리셋 전압"], ["v_on", "V", "", "재시작 전압 (v_min+0.5)"], ["boot_s", "s", 0.2]], doc: "can_node: CAN 노드(목록 가능), forces: 꺼져 있는 동안 0이 되는 신호 (예: pt.motor.*.torque_cmd)." },
  load: { label: "부하", group: "LV", icon: "⏚", terms: ["a", "b"], params: [["p_w", "W", 10], ["i_a", "A", ""], ["r_ohm", "Ω", ""], ["v_nominal", "V", 12]], doc: "펌프·팬·램프. inrush: {factor, tau_s} 모터 기동 전류. control: 켜는 조건." },
  fuse: { label: "퓨즈", group: "LV", icon: "∿", terms: ["a", "b"], params: [["rating_a", "A", 10], ["i2t_a2s", "A²s", "", "기본 1.6×정격²"], ["r_ohm", "Ω", ""]], doc: "용단 적분(냉각 포함)이 I²t에 닿으면 끊어짐." },
  switch: { label: "스위치", group: "LV", icon: "⏻", terms: ["a", "b"], params: [["closed", "bool", true], ["r_on_ohm", "Ω", 0.01]], doc: "open_when / closed_when: 조건 {signal, above|below, hysteresis, delay_s, latch} 또는 all/any." },
  relay: { label: "릴레이", group: "LV", icon: "⊣⊢", terms: ["a", "b", "coil_a", "coil_b"], params: [["coil_r_ohm", "Ω", 90], ["pull_in_v", "V", 8], ["drop_out_v", "V", 3], ["close_ms", "ms", 10], ["open_ms", "ms", 5], ["r_on_ohm", "Ω", 0.01], ["rating_a", "A", 30], ["normally", "open/closed", "open"]], doc: "" },
  regulator: { label: "레귤레이터", group: "LV", icon: "▤", terms: ["in", "out", "gnd"], params: [["v_out", "V", 5], ["dropout_v", "V", 1], ["r_out_ohm", "Ω", 0.05], ["i_max_a", "A", 0.5], ["i_q_a", "A", 0.002]], doc: "선형 레귤레이터(센서 5 V 전원)." },
  wire: { label: "전선", group: "배선", icon: "〰", terms: ["a", "b"], params: [["length_m", "m", 1, "route가 있으면 경로 길이"], ["area_mm2", "mm²", 0.5], ["material", "copper/aluminium", "copper"], ["rating_a", "A", "", "기본: 단면적 표"], ["contact_r_ohm", "Ω", "", "핀 하나"], ["temp_c", "°C", ""]], doc: "pins: [X1.3] 커넥터 핀, route: [[x,y,z], ...] 하네스 경로 (차량 좌표, m)." },
  potentiometer: { label: "포텐셔미터", group: "배선", icon: "↗", terms: ["a", "b", "wiper"], params: [["r_ohm", "Ω", 5000], ["sensor", "센서", ""], ["channel", "ch1/ch2", "ch1"], ["signal", "신호", ""]], doc: "sensor·channel: 페달 센서의 전압 맵을 따름. 아니면 signal + ratio: [r0, r1]." },
  adc: { label: "ADC 입력", group: "배선", icon: "⊳", terms: ["a", "ref", "vref"], params: [["r_in_ohm", "Ω", 1e6], ["pull_down_ohm", "Ω", ""], ["v_ref_nominal", "V", 5], ["sensor", "센서", ""], ["channel", "ch1/ch2", "ch1"]], doc: "vref를 주면 레이시오메트릭. sensor·channel이면 그 센서 채널이 이 전압을 읽음." },
  resistor: { label: "저항", group: "수동", icon: "▭", terms: ["a", "b"], params: [["r_ohm", "Ω", 100]], doc: "" },
  capacitor: { label: "커패시터", group: "수동", icon: "⊪", terms: ["a", "b"], params: [["c_f", "F", 1e-4], ["esr_ohm", "Ω", 0], ["v0", "V", 0, "initial: off일 때"]], doc: "" },
  inductor: { label: "인덕터", group: "수동", icon: "ᘐ", terms: ["a", "b"], params: [["l_h", "H", 1e-3], ["r_ohm", "Ω", 0]], doc: "" },
  diode: { label: "다이오드", group: "수동", icon: "▷|", terms: ["a", "b"], params: [["v_f", "V", 0.7], ["r_on_ohm", "Ω", 0.01]], doc: "a: 애노드, b: 캐소드" },
  voltage_source: { label: "전압원", group: "수동", icon: "⊕", terms: ["pos", "neg"], params: [["v", "V", 12], ["r_ohm", "Ω", 0.001], ["signal", "신호", "", "값을 신호에서"]], doc: "" },
  current_source: { label: "전류원", group: "수동", icon: "⊙", terms: ["pos", "neg"], params: [["i_a", "A", 1]], doc: "" },
};
const OPTIONAL_TERMS = new Set(["ref", "vref"]);
const FAULT_TYPES = ["open", "short", "contact_resistance", "stuck_closed", "stuck_open", "blow"];

// --- Connection ---------------------------------------------------------------------------
function send(method, params) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ jsonrpc: "2.0", method, params: params || {} })); }
function notice(text, level) {
  const d = document.createElement("div"); d.className = "notice " + (level || ""); d.textContent = text;
  $("notices").appendChild(d); setTimeout(() => d.remove(), level === "error" ? 12000 : 5000);
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function setDirty(v) { dirty = v; $("dirty").textContent = v ? "저장 안 됨" : ""; }

function connect() {
  ws = new WebSocket(wsUrl);
  ws.onopen = () => { $("conn-dot").classList.add("on"); $("conn").textContent = "연결됨"; send("elec.get"); };
  ws.onclose = () => { $("conn-dot").classList.remove("on"); $("conn").textContent = "연결 안 됨 (재시도 중)"; setTimeout(connect, 1000); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.method === "elec.state") onState(m.params);
    else if (m.method === "elec.op") onOp(m.params);
    else if (m.method === "notice") notice(m.params.text, m.params.level);
  };
}

function onState(p) {
  const first = state === null;
  state = p;
  $("project").textContent = p.project + " · " + p.netlist_file;
  $("load-error").innerHTML = p.load_error ? `<div class="error-box">마지막 저장을 불러오지 못해서 이전 파일로 되돌렸습니다:\n${esc(p.load_error)}</div>` : "";
  $("signal-list").innerHTML = p.signals.map((s) => `<option value="${esc(s.name)}">${esc(s.unit)}</option>`).join("");
  if ((!dirty && p.netlist_yaml !== fingerprint) || first) {
    fingerprint = p.netlist_yaml;
    try { net = jsyaml.load(p.netlist_yaml) || {}; } catch (err) { net = {}; notice("netlist를 읽지 못했습니다: " + err.message, "error"); }
    if (first && p.running) $("values").value = "live";
    ensureLayout(false);
    renderAll();
    if (first) { fit(); requestCheck(); }
  } else {
    renderValues();
    if (tab !== "faults") renderTab();
  }
}

function onOp(p) {
  op = p.ok ? p.op : null;

function netlistText() {
  const out = { ...net };

  delete out.layout;
  // Components and faults one per line; the editor layout as one line per item.
  let text = HEADER + jsyaml.dump(out, { noRefs: true, lineWidth: 160, flowLevel: 2 });
  const L = layout(), key = (k) => jsyaml.dump(k).trim();
  const used = new Set(allNets());
  const cs = comps().filter((c) => L.components[c.id]), ns = Object.keys(L.nets).filter((n) => used.has(n));
  if (cs.length || ns.length) {
    text += "layout:   # 회로 편집기의 배치 (해석에는 쓰지 않음)\n";
    if (cs.length) text += "  components:\n" + cs.map((c) => `    ${key(c.id)}: [${L.components[c.id].join(", ")}]\n`).join("");
    if (ns.length) text += "  nets:\n" + ns.map((n) => `    ${key(n)}: [${L.nets[n].join(", ")}]\n`).join("");
  }
  return text;
}

};
$("save").onclick = () => {
  if (!comps().length) { notice("부품이 없습니다.", "error"); return; }
  send("elec.save", { netlist: netlistText(), reload: true });
  setDirty(false);
  fingerprint = "";  // take the file as the simulator reloaded it (or rolled it back)
};

renderPalette();
renderTabs();
setInterval(() => { if (!dirty) send("elec.get"); }, 1000);
connect();
window.vsimElec = { get net() { return net; }, get state() { return state; }, get op() { return op; } };
</script>
</body>
</html>
